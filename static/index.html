<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssetHub</title>
<style>
  :root {
    --bg: #0c0c0e; --card: #1c1c1f; --card-hover: #232326;
    --border: rgba(255,255,255,.08); --text: #f5f5f7; --muted: #8e8e93;
    --accent: #2f81f7; --red: #ff453a; --green: #30d158;
    --up: var(--green); --down: var(--red);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px;
         -webkit-font-smoothing: antialiased; }
  header { background: rgba(12,12,14,.85); backdrop-filter: blur(18px);
           border-bottom: 1px solid var(--border); padding: 24px 18px;
           display: flex; align-items: center; gap: 12px; }
  .top-sticky { position: sticky; top: 0; z-index: 50; background: rgba(12,12,14,.92);
                backdrop-filter: blur(18px); }
  .top-sticky header { background: transparent; }

  header h1 { position: relative; display: inline-block; margin: 0 0 0 18px; padding: 0; }
  header .logo { height: 36px; width: auto; display: block; }

  /* Logo 红点呼吸效果：绝对定位对齐图片内红点（10.8% / 8.4% ≈ 6.3px/3px） */
  .logo-dot {
    position: absolute;
    left: 6.3px; top: 3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff453a;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: dotBreathe 2.2s ease-in-out infinite;
  }
  @keyframes dotBreathe {
    0%, 100% {
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.6);
      opacity: 1;
    }
    50% {
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 0 0 7px rgba(255, 69, 58, 0);
      opacity: 0.85;
    }
  }

  /* 顶部滚动新闻条 */
  .ticker-wrap { border-bottom: 1px solid var(--border); overflow: hidden; position: relative; z-index: 0; }
  .ticker { display: inline-flex; white-space: nowrap; align-items: center;
            padding: 8px 18px; will-change: transform; }
  .ticker-item { display: inline-flex; align-items: center; gap: 8px; margin-right: 34px;
                 color: var(--text); text-decoration: none; font-size: 13px; }
  .ticker-item:hover .tk-title { color: var(--accent); }
  .tk-title { transition: color .15s; }
  .tk-chip { font-size: 10px; font-weight: 700; letter-spacing: .5px;
             background: rgba(47,129,247,.22); color: #6db0ff;
             border: 1px solid rgba(47,129,247,.4); border-radius: 5px; padding: 1px 6px; }
  .tk-chip.multi { background: rgba(255,69,58,.16); color: var(--red);
                   border-color: rgba(255,69,58,.4); }
  .tk-chip.generic { background: rgba(142,142,147,.14); color: var(--muted);
                     border-color: rgba(142,142,147,.3); font-weight: 500; }
  .tk-chip.cn { background: rgba(255,159,10,.16); color: #ff9f0a;
                border-color: rgba(255,159,10,.4); font-weight: 500; }
  .tag-related.cn-tag { background: rgba(255,159,10,.14); color: #ff9f0a; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .spacer { flex: 1; }
  .refresh { background: var(--card); color: var(--text); border: 1px solid var(--border);
             border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12px;
             display: inline-flex; align-items: center; gap: 5px; }
  .refresh:hover { background: var(--card-hover); }
  .caret { vertical-align: 1px; }
  /* 刷新 icon 旋转一圈 */
  @keyframes spin360 { to { transform: rotate(360deg); } }
  .refresh.spinning svg { animation: spin360 .7s ease; }
  /* 语言选择下拉（刷新按钮左侧）：fixed 脱离容器层叠，保证在最上层 */
  .lang-wrap { position: relative; }
  .lang-menu { position: fixed; right: auto; top: auto; background: var(--card);
               border: 1px solid var(--border); border-radius: 10px; padding: 4px;
               box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 9999; min-width: 110px; }
  .lang-item { padding: 7px 14px; cursor: pointer; font-size: 12.5px; color: var(--text);
               border-radius: 7px; white-space: nowrap; }
  .lang-item:hover { background: var(--card-hover); }
  .lang-item.active { color: var(--accent); font-weight: 600; }

  /* 涨跌配色开关 */
  .color-switch { display: flex; align-items: center; gap: 6px; cursor: pointer;
                  user-select: none; }
  .cs-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cs-track { width: 40px; height: 22px; border-radius: 11px; background: var(--card-hover);
              border: 1px solid var(--border); position: relative; }
  .cs-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
              border-radius: 50%; background: var(--muted);
              transition: left .25s cubic-bezier(.4,.2,.2,1), background .2s; }
  .color-switch.mode-up-green .cs-thumb { left: 20px; background: var(--green); }
  .color-switch.mode-up-red .cs-thumb { left: 2px; background: var(--red); }
  .meta { color: var(--muted); font-size: 11px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; }
  .badge.open { background: rgba(48,209,88,.18); color: var(--green); }
  .badge.closed { background: rgba(142,142,147,.18); color: var(--muted); }

  main { max-width: 920px; margin: 0 auto; padding: 18px 18px 126px; }

  /* 底部导航 */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
                display: flex; background: rgba(12,12,14,.92); backdrop-filter: blur(18px);
                border-top: 1px solid var(--border); padding: 6px 0 max(8px, env(safe-area-inset-bottom)); }
  .nav-btn { flex: 1; background: none; border: none; color: var(--muted); cursor: pointer;
             display: flex; flex-direction: column; align-items: center; gap: 3px;
             padding: 6px 0 11px; font-size: 11px; font-weight: 600; position: relative;
             transition: color .15s; }
  .nav-btn .nav-icon { display: flex; }
  .nav-btn .nav-icon svg { width: 22px; height: 22px; display: block; }
  .nav-btn.active { color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
          padding: 12px 14px; transition: background .12s; cursor: pointer;
          display: flex; flex-direction: column;
          justify-content: center; position: relative; }
  .card:hover { background: var(--card-hover); }

  /* 3D 翻转动效（股票卡片） */
  .flip { aspect-ratio: 1 / 1; perspective: 1000px; cursor: pointer;
          transition: transform .12s; }
  .flip-inner { position: relative; width: 100%; height: 100%;
                transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,.2,.2,1); }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  /* 翻转期间暂停滚轮动画并隐藏正面价格，彻底消除 3D 翻转残影 */
  .flip.flipping .od .strip { transition: none !important; animation: none !important; }
  .flip.flipping .card.front .price { visibility: hidden; }
  /* 翻转期间清除 hover 合成层，避免 will-change 与 rotateY 叠加 */
  .flip.flipping .card.front .code,
  .flip.flipping .card.front .name,
  .flip.flipping .card.front .price,
  .flip.flipping .card.front .change {
    will-change: auto;
    transition: none !important;
    transform: none !important; }
  .flip .front, .flip .back { position: absolute; inset: 0;
                              -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .flip .back { transform: rotateY(180deg); }
  .flip .card { width: 100%; height: 100%; }
  .flip .card.front { overflow: hidden; }
  /* hover 渐现 K 线：保持原始 flex 居中机制（子元素直接排列，不包裹不改布局），
     仅底部 K 线绝对定位叠加 + hover 时各信息行整体上移 */
  .card.front .front-kline { position: absolute; left: 0; right: 0; bottom: 6px;
                             height: 34%; opacity: 0; transform: translateY(12px);
                             transition: opacity .35s ease, transform .35s ease;
                             pointer-events: none; }
  .card.front .front-kline svg { width: 100%; height: 100%; display: block; }
  .card.front .code, .card.front .name, .card.front .price, .card.front .change {
    transition: transform .28s ease-out; }
  /* hover 上移用 GPU 合成（translate3d）平滑执行 */
  .flip:hover .card.front .code,
  .flip:hover .card.front .name,
  .flip:hover .card.front .price,
  .flip:hover .card.front .change {
    transform: translate3d(0, -24px, 0); }
  /* hover 时价格滚轮静态化：暂停容器与滚条的 transition，杜绝嵌套 transform 触发合成层重绘 */
  .flip:hover .od, .flip:hover .od .strip { transition: none !important; }
  /* 根治闪烁：hover 时价格从滚轮结构切换为纯文本显示（滚轮合成层不参与 transform 动画） */
  .price { position: relative; }
  .price .txt-view { visibility: hidden; position: absolute; left: 0; top: 0;
                     white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* 刷新时价格后的小 loading 圆点 */
  .pl-spin { display: inline-block; width: 9px; height: 9px; margin-left: 6px;
             border: 1.5px solid rgba(142,142,147,.3); border-top-color: rgba(142,142,147,.7);
             border-radius: 50%; animation: pl-rot .7s linear infinite;
             vertical-align: 2px; }
  @keyframes pl-rot { to { transform: rotate(360deg); } }
  .flip:hover .price .od-view { visibility: hidden; }
  .flip:hover .price .txt-view { visibility: visible; }
  .flip:hover .card.front .front-kline { opacity: .85; transform: translateY(0); }
  .flip .card.back { background: var(--card-hover); justify-content: flex-start;
                     align-items: stretch; text-align: left; overflow: hidden;
                     padding-bottom: 14px; }
  .flip .card.back .b-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .flip .card.back .b-code { font-size: 18px; font-weight: 700; letter-spacing: .3px;
                             margin-bottom: 6px; color: #fff; }
  .flip .card.back .b-row { display: flex; justify-content: space-between; align-items: center;
                            font-size: 13.5px; padding: 3px 0;
                            border-bottom: 1px solid rgba(255,255,255,.05); }
  .flip .card.back .b-row:last-of-type { border-bottom: none; }
  .flip .card.back .b-row span { color: var(--muted); font-size: 12px; }
  .flip .card.back .b-row b { font-weight: 600; font-size: 14px; }
  .flip .card.back .b-actions { display: flex; gap: 8px; margin-top: auto; }
  .flip .card.back .b-edit, .flip .card.back .b-del { flex: 1; border-radius: 8px;
                            padding: 5px 0; font-size: 12px; font-weight: 600; cursor: pointer; }
  .flip .card.back .b-edit { background: rgba(255,255,255,.1); color: #fff;
                             border: 1px solid rgba(255,255,255,.25); }
  .flip .card.back .b-edit:hover { background: rgba(255,255,255,.18); }
  .flip .card.back .b-del { background: rgba(255,69,58,.12); color: var(--red);
                            border: 1px solid rgba(255,69,58,.35); }
  .flip .card.back .b-del:hover { background: rgba(255,69,58,.22); }
  .modal-actions button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .del-tip { font-size: 13px; color: var(--muted); margin-bottom: 4px; line-height: 1.6; }
  .card .top { position: absolute; top: 10px; right: 12px;
               display: flex; justify-content: flex-end; align-items: center; margin: 0; }
  .card .tag { font-size: 11px; color: var(--muted); }
  .card .icon { font-size: 10px; color: var(--muted); border: 1px solid var(--border);
                border-radius: 5px; padding: 1px 6px; }
  .card .icon.session { border: none; background: none; padding: 0; border-radius: 0; }
  .card .code { font-size: 18px; font-weight: 700; letter-spacing: .3px; margin-bottom: 2px;
                color: #fff; }
  .card .name { font-size: 12px; color: var(--muted); margin-top: 1px; margin-bottom: 10px; }
  .card .price { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; letter-spacing: -.5px;
                 font-variant-numeric: tabular-nums; }

  /* 基金卡片市值：白色 + 字号略小（股票卡片价格不受影响） */
  #cards-funds .card .price, #cards-funds-cn .card .price {
    color: var(--text);
    font-size: clamp(18px, 2.3vw, 26px);
  }

  /* 价格数字计数器滚轮：每位数字是 0-9 循环滚轮，滚动经过中间数字到达目标位 */
  .od { display: inline-block; position: relative; overflow: hidden; height: 1em;
        width: .62em; line-height: 1em; vertical-align: bottom; text-align: center; }
  .od .strip { position: absolute; top: 0; left: 0; width: .62em;
               transition: transform .45s cubic-bezier(.25,.6,.3,1); }
  .od .strip span { display: block; height: 1em; width: .62em; line-height: 1em; text-align: center; }
  .od .lit { display: block; height: 1em; width: .62em; line-height: 1em; }
  .card .change { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .card .change .session { font-size: 11px; color: var(--muted); }

  /* 基金卡片：一行一个，左侧信息 + 右侧参考指数走势图（美元/人民币通用） */
  #cards-funds, #cards-funds-cn { display: grid; grid-template-columns: 1fr; gap: 12px; }
  #cards-funds .card, #cards-funds-cn .card { aspect-ratio: auto; flex-direction: row; align-items: center;
                       justify-content: space-between; gap: 20px; padding: 16px 18px; }
  #cards-funds .card .fund-left, #cards-funds-cn .card .fund-left { flex: 1; min-width: 0; }
  #cards-funds .card .fund-spark, #cards-funds-cn .card .fund-spark { width: 42%; max-width: 260px; }
  #cards-funds .card .fund-isin, #cards-funds-cn .card .fund-isin { font-size: 10px; color: var(--muted); font-weight: 500;
                                  margin-left: 6px; letter-spacing: .3px; }
  #cards-funds .card .change.ret, #cards-funds-cn .card .change.ret { font-size: 12px; margin-top: 3px; }
  #cards-funds .card .fund-spark svg, #cards-funds-cn .card .fund-spark svg { width: 100%; height: 44px; display: block; }
  #cards-funds .card .fund-spark .empty, #cards-funds-cn .card .fund-spark .empty { color: var(--muted); font-size: 11px; padding: 12px 0; }

  .up { color: var(--up); }
  .down { color: var(--down); }

  /* 手动录入弹窗 */
  .modal-mask { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55);
                display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
           padding: 20px; width: 100%; max-width: 340px; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 10px;
                 opacity: 0.5; }
  .modal input { width: 100%; margin-top: 4px; background: #141416; color: var(--text);
                 border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
                 font-size: 14px; outline: none; }
  .modal input::placeholder { color: #9e9ea4; opacity: 0.5; }
  .modal input:focus { border-color: var(--accent); }
  .modal input:disabled { background: rgba(142,142,147,.12); color: var(--muted);
                          border-color: rgba(142,142,147,.2); cursor: not-allowed; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; border: 1px solid var(--border); background: var(--card-hover);
                          color: var(--text); border-radius: 10px; padding: 9px 0;
                          font-size: 13px; font-weight: 600; cursor: pointer; }
  .modal-actions button.primary { background: #fff; border-color: #fff; color: #1c1c1e; }

  section { margin-top: 22px; }
  .sec-head { display: flex; align-items: center; gap: 12px; padding: 0 4px 10px; }
  .sec-head h2 { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .sec-nums { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .sec-nums .num { font-weight: 600; white-space: nowrap; }
  .sec-nums .sep { opacity: .3; }
  /* 投资偏好：左柱状图 + 右雷达图（无背景、紧凑），美元/人民币两组 */
  .pref-group { margin-bottom: 12px; }
  .pref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .pref-grid { grid-template-columns: 1fr; } }
  .pref-card { padding: 2px 4px; display: flex; flex-direction: column; }
  #pref-bars-us, #pref-bars-cn { flex: 1; display: flex; flex-direction: column;
                                 justify-content: space-evenly; min-height: 230px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-name { width: 62px; font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  .bar-track { flex: 1; height: 14px; background: rgba(142,142,147,.1); border-radius: 7px;
               overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: 7px; min-width: 2px;
              background: linear-gradient(90deg, rgba(255,69,58,.5), #ff453a); }
  .bar-pct { width: 44px; font-size: 11px; font-weight: 700; color: #ff453a; }
  #pref-radar-us, #pref-radar-cn { display: flex; align-items: center; justify-content: center;
                                   flex: 1; min-height: 210px; }
  #pref-radar-us svg, #pref-radar-cn svg { width: 260px; height: 260px; max-width: 100%;
                                           display: block; }
  /* 数据到位动效：淡入 + 上移，不突然出现 */
  .pop-in { animation: popIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
           overflow: hidden; }

  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }

  /* 顶部市场 tab（美股 / A股），居左 + 滑动下划线 */
  .market-tabs { position: relative; display: flex; gap: 18px; margin: 2px 0 14px;
                 align-items: center; }
  .mtab { background: none; border: none; color: var(--muted); font-size: 15px; font-weight: 600;
          padding: 4px 2px 8px; cursor: pointer; transition: color .15s; }
  .mtab:hover { color: var(--text); }
  .mtab.active { color: var(--text); }
  .mtab-slider { position: absolute; bottom: 2px; left: 0; height: 3px; width: 0;
                 border-radius: 2px; background: #fff;
                 transition: left .25s cubic-bezier(.4,.2,.2,1), width .25s cubic-bezier(.4,.2,.2,1); }
  .empty-tip { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 14px;
               line-height: 2; }
  .summary-card { padding: 12px 4px; overflow: hidden; }
  .summary-card .value { white-space: nowrap; }
  .summary-card .label, .summary-card .hint { white-space: nowrap; }
  .summary-card .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .summary-card .value { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; }
  .summary-card .value.sm { font-size: clamp(15px, 2.1vw, 22px); }
  .summary-card .hint { color: var(--muted); font-size: 11.5px; margin-top: 5px; }
  .eye { background: none; border: none; cursor: pointer; padding: 0; margin-left: 5px;
         display: inline-flex; align-items: center; color: var(--muted);
         vertical-align: middle; position: relative; top: -1px; }
  .eye svg { width: 14px; height: 14px; }
  /* logo 旁的 slogan：底部与 logo 底边对齐，微调下移 2px、左移 6px；中文加大字距 */
  .slogan { font-size: 14px; color: var(--muted); font-weight: 500;
            margin-left: 12px; letter-spacing: .4px; white-space: nowrap; align-self: flex-end;
            transform: translateY(2px); }
  html[lang="zh"] .slogan { letter-spacing: 2px; }
  .eye:hover { color: var(--text); }
  /* 持仓区域「添加+」按钮（替代原虚线添加卡片，位于 sec-head 最右侧） */
  .sec-add { background: transparent; border: none; color: var(--muted);
             border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer;
             transition: all .15s; white-space: nowrap; }
  .sec-add:hover { color: var(--text); }

  /* 核心市场指标一行（小字号） */
  .markets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
             margin: -4px 0 2px; padding: 10px 4px; border-top: 1px solid rgba(255,255,255,.06);
             border-bottom: 1px solid rgba(255,255,255,.06); }
  .mkt-item { overflow: hidden; }
  .mkt-item .label { color: var(--muted); font-size: 10px; margin-bottom: 3px; white-space: nowrap; }
  .mkt-item .value { font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: -.2px; }
  .mkt-item .change { font-size: 10px; margin-top: 2px; white-space: nowrap; }
  .mkt-item .spark { margin-top: 4px; }
  .mkt-item .spark svg { width: 100%; height: 26px; display: block; }
  .mkt-item .spark .empty { color: var(--muted); font-size: 10px; padding: 4px 0; }

  /* 新闻页顶部 tag 切换栏：最多 2 行，超出纵向滚动 */
  .tabs { display: flex; gap: 8px; padding: 2px 4px 12px; flex-wrap: wrap;

let sparkSeq = 0;
let upGreen = false;   // 默认涨红跌绿（中国习惯）；true = 涨绿跌红

  document.documentElement.style.setProperty('--down', upGreen ? 'var(--red)' : 'var(--green)');
  const sw = $('cs');
  sw.classList.toggle('mode-up-green', upGreen);

function sparkSvg(points, w, h, dir, progress, sw) {
  w = w || 100; h = h || 26;
  if (!points || points.length < 2) return '<div class="empty">无趋势数据</div>';
  const strokeW = sw || 1.6;
  // progress: 当日交易进度 0-1，曲线只画到 progress*w（右侧留白=未交易时段）
  const p = (progress === undefined || progress === null) ? 1 : Math.max(0.05, Math.min(1, progress));
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max - min) || 1;
  const step = (w * p) / (points.length - 1);
  const coords = points.map((pt, i) => ({
    x: i * step,
    y: h - 3 - (pt - min) / range * (h - 8)
  }));
  // 平滑曲线：中点二次贝塞尔（Q），每个点作为控制点、相邻点中点为终点，曲线平滑无锯齿
  let linePath = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
  for (let i = 1; i < coords.length - 1; i++) {
    const c = coords[i], n = coords[i + 1];
    const mx = (c.x + n.x) / 2, my = (c.y + n.y) / 2;
    linePath += ` Q ${c.x.toFixed(1)} ${c.y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  const last = coords[coords.length - 1];
  linePath += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;
  // dir: 1=涨 -1=跌 0/缺省=按曲线首尾方向；颜色跟随当前配色模式
  const upCol = upGreen ? '#30d158' : '#ff453a';
  const downCol = upGreen ? '#ff453a' : '#30d158';
  const up = points[points.length - 1] >= points[0];
  let col;
  if (dir === 1) col = upCol;
  else if (dir === -1) col = downCol;
  else col = up ? upCol : downCol;
  const gid = 'spark-grad-' + (++sparkSeq);
  const xEnd = (w * p).toFixed(1);
  const areaPath = `${linePath} L ${xEnd} ${h} L 0 ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#${gid})"/>
    <path d="${linePath}" fill="none" stroke="${col}" stroke-width="${strokeW}"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

    // spark 支持 {pts, progress}（当日分时 + 按盘中时间进度留白）或历史数组
    const sp = m.spark;

      ? sparkSvg(sp.pts, 100, 26, mDir, sp.progress)

    return `<div class="mkt-item pop-in" style="animation-delay:${i * 60}ms">

}

function renderPrefRadar(el, radar) {
  if (!radar.length) { el.innerHTML = '<div class="empty">' + _t('no_data') + '</div>'; return; }
  const size = 300, cx = 150, cy = 150, R = 100;
  const n = radar.length;
  const angle = i => -Math.PI / 2 + i * 2 * Math.PI / n;   // 从 12 点方向顺时针
  const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  // 网格（3 圈）
  let svg = `<svg viewBox="0 0 ${size} ${size}">`;
  for (const k of [0.33, 0.66, 1]) {
    const pts = radar.map((_, i) => pt(i, R * k).map(v => v.toFixed(1)).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="rgba(142,142,147,.2)" stroke-width="1"/>`;
  }
  // 轴
  radar.forEach((_, i) => {
    const [x, y] = pt(i, R);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(142,142,147,.18)" stroke-width="1"/>`;
  });
  // 数据多边形（按占比 0-60% 映射到半径）
  const scale = v => Math.min(1, v / 60) * R;
  const dataPts = radar.map((r, i) => pt(i, scale(r.pct)).map(v => v.toFixed(1)).join(',')).join(' ');
  svg += `<polygon points="${dataPts}" fill="rgba(255,69,58,.3)" stroke="#ff453a" stroke-width="1.6" stroke-linejoin="round"/>`;
  // 数据点
  radar.forEach((r, i) => {
    const [x, y] = pt(i, scale(r.pct));
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#ff453a"/>`;
  });
  // 轴标签（留足边距，文字完整显示；长标签自动换行或缩短）
  radar.forEach((r, i) => {
    const [x, y] = pt(i, R + 24);
    const raw = secName(r.axis); const label = raw.length > 6 ? raw.slice(0, 6) + '…' : raw;
    svg += `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${label} ${r.pct}%</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
}

  });
}

/* 价格计数器滚轮：只翻转变化的数字位，未变化的位静止显示 */
const priceFlipCache = {};
function odStrip() {
  // 滚轮内容：0-9 循环三遍，支持任意方向滚动
  let s = '';
  for (let k = 0; k < 3; k++) {
    s += '<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>' +
         '<span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>';
  }
  return s;
}
/* 数字位滚轮：oldD=旧数字, newD=新数字；滚动经过中间数字到新值 */
function odDigit(oldD, newD) {
  // 方向取最短路径
  let diff = newD - oldD;
  if (diff > 5) diff -= 10;
  if (diff < -5) diff += 10;
  const from = 10 + oldD;
  const to = from + diff;
  return `<span class="od"><span class="strip" data-from="${from}" data-go="${to}">${odStrip()}</span></span>`;
}

function applyPriceFlips() {
  document.querySelectorAll('[data-flip]').forEach(el => {
    const key = el.dataset.flip;
    const text = el.dataset.px || el.textContent;   // 从 data-px 读价格（滚轮 DOM 不干扰）
    if (text.includes('*')) { el.dataset.privacy = '1'; return; }  // 隐私模式：不动画
    const wasPrivacy = el.dataset.privacy === '1';
    delete el.dataset.privacy;
    const prev = priceFlipCache[key] || '';
    const wasPlaceholder = prev === '--';           // 上一帧是占位（价格刚到）
    priceFlipCache[key] = text;
    if (wasPrivacy) return;                         // 刚解除隐私：只记录不滚动
    if (!prev || prev === text) return;             // 首次渲染 / 价格没变：不重建 DOM
    const chars = [...text];
    const oldChars = [...prev];
    const maxLen = Math.max(chars.length, oldChars.length);
    let html = '';
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const oldCh = i < maxLen ? (oldChars[i] || '') : '';
      const isDigit = /[0-9]/.test(ch);
      if (isDigit && /[0-9]/.test(oldCh) && oldCh !== ch) {
        // 数字位变化：滚轮从旧值滚动经过中间数字到新值
        html += odDigit(parseInt(oldCh), parseInt(ch));
      } else if (isDigit) {
        // 新增位（占位→价格）：直接生成滚轮，稍后从下方滚入
        html += odDigit(null, parseInt(ch));
      } else {
        // 数字没变 / 符号位：静止显示
        html += `<span class="od"><span class="lit">${ch}</span></span>`;
      }
    }
    el.innerHTML = `<span class="od-view">${html}</span><span class="txt-view">${text}</span>`;
    // 先渲染在旧位置（无过渡），下一帧滚到新位置
    el.querySelectorAll('.strip[data-from]').forEach(s => {
      s.style.transition = 'none';
      s.style.transform = `translateY(-${s.dataset.from}em)`;
    });
    // 占位→价格：新增位从下方 4 格滚入到位（滚动出现）
    if (wasPlaceholder) {
      el.querySelectorAll('.strip:not([data-from])').forEach(s => {
        const go = parseInt(s.dataset.go);
        s.style.transition = 'none';
        s.style.transform = `translateY(-${go - 4}em)`;
      });
    }
    requestAnimationFrame(() => {
      el.querySelectorAll('.strip').forEach(s => {
        s.style.transition = '';
        s.style.transform = `translateY(-${s.dataset.go}em)`;
      });
    });
  });
}

function autoNormCode(raw) {
  /* 股票代码智能规范化：6 位纯数字自动补 A 股前缀（6→沪 sh，0/3→深 sz，4/8/9→北交所 bj）；
     已带 sh/sz/bj 前缀的原样保留（转小写前缀）；其余按美股大写 */
  const c = (raw || '').trim().toUpperCase();
  if (/^(SH|SZ|BJ)\d+$/.test(c)) return c.slice(0, 2).toLowerCase() + c.slice(2);
  if (/^\d{6}$/.test(c)) {
    if (/^6/.test(c)) return 'sh' + c;
    if (/^[03]/.test(c)) return 'sz' + c;
    if (/^[489]/.test(c)) return 'bj' + c;
  }
  return c;
}

  const code = autoNormCode($('m-code').value);

let tickerCache = [];
let tickerPos = 0;            // 当前位移（负值，向右往左滚）
let tickerRAF = null;         // requestAnimationFrame id
let tickerPaused = false;     // 悬停暂停标志
let tickerHalfW = 0;          // 单份内容宽度
let tickerLastTs = 0;         // 上一帧时间戳

/* JS 驱动无缝滚动（替代 CSS animation-play-state，规避 WebKit 悬停暂停跳动 bug） */
function tickerStep(ts) {
  if (!tickerPaused && tickerHalfW > 0) {
    const dt = tickerLastTs ? (ts - tickerLastTs) : 16;
    tickerPos -= 60 * dt / 1000;              // 速度约 60px/s
    if (-tickerPos >= tickerHalfW) tickerPos += tickerHalfW;   // 无缝回卷
    $('ticker').style.transform = `translateX(${tickerPos}px)`;
  }
  tickerLastTs = ts;
  tickerRAF = requestAnimationFrame(tickerStep);
}

function tickerStart() {
  cancelAnimationFrame(tickerRAF);
  tickerPos = 0; tickerLastTs = 0;
  tickerHalfW = $('ticker').scrollWidth / 2;
  if (tickerHalfW > 0) tickerRAF = requestAnimationFrame(tickerStep);
}

    const t = [...n.title];

  }).join('');

      const d = await api('/api/stocknews?code=' + k);
      $('news-list').innerHTML =
        `<div class="news-item"><div class="meta">${_t('search_src')}</div></div>` +
        (d.items.map(n => `
          <div class="news-item">
            <a href="${n.url}" target="_blank">${n.title}</a>
            <div class="meta">${n.time}${n.media ? ' ｜ ' + n.media : ''}</div>
          </div>`).join('') || '<div class="loading">暂无相关新闻</div>');
    }
  } catch (e) { $('news-list').innerHTML = '<div class="loading">' + _t('load_failed') + e.message + '</div>'; }
}

async function loadStockNews(code) {
  switchPage('news');
  switchTab(document.querySelector(`.tab[data-k="${code}"]`) || document.querySelector('.tab[data-k="__us__"]'), true);
  $('news-list').innerHTML = '<div class="loading" data-i18n="loading">加载中…</div>';
  try {
    const d = await api('/api/stocknews?code=' + code);
    $('news-list').innerHTML =
      `<div class="news-item"><div class="meta">${_t('search_src')}</div></div>` +
      (d.items.map(n => `
        <div class="news-item">
          <a href="${n.url}" target="_blank">${n.title}</a>
          <div class="meta">${n.time}${n.media ? ' ｜ ' + n.media : ''}</div>
        </div>`).join('') || '<div class="loading">暂无相关新闻</div>');
  } catch (e) { $('news-list').innerHTML = '<div class="loading">' + _t('load_failed') + e.message + '</div>'; }
}

function switchTab(el, skipFilter) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (!skipFilter) loadNewsByTag(el);
}

function switchPage(page) {
  const asset = page === 'asset';
  $('page-asset').style.display = asset ? '' : 'none';
  $('page-news').style.display = asset ? 'none' : '';
  $('nav-asset').classList.toggle('active', asset);
  $('nav-news').classList.toggle('active', !asset);
}

function moveMtabSlider() {
  const active = document.querySelector('.mtab.active');
  const sl = $('mtab-slider');
  if (!active) return;
  sl.style.left = active.offsetLeft + 'px';
  sl.style.width = active.offsetWidth + 'px';
}

function switchMarketTab(k) {
  document.querySelectorAll('.mtab').forEach(t => t.classList.toggle('active', t.dataset.k === k));
  $('us-view').style.display = k === 'us' ? '' : 'none';
  $('cn-view').style.display = k === 'cn' ? '' : 'none';
  // 投资偏好跟随 tab：美元 tab 显示美元组，人民币 tab 显示人民币组
  $('pref-group-us').style.display = k === 'us' ? '' : 'none';
  $('pref-group-cn').style.display = k === 'cn' ? '' : 'none';
  // 切到可见视图后重新触发价格翻动动画（隐藏元素动画不播放）
  requestAnimationFrame(() => applyPriceFlips());
  moveMtabSlider();
}

function refreshAll(ev) {
  // 刷新 icon 转一圈（重触发动画后由 animationend 移除类）
  const btn = (ev && ev.currentTarget) || document.querySelector('header .refresh');
  if (btn) {
    btn.classList.remove('spinning');
    void btn.offsetWidth;
    btn.classList.add('spinning');
    btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
  }
  showPriceLoading();   // 价格后加小 loading 动效，数据返回重建后自动消失
  loadPortfolio(true).then(() => toast(_t('refreshed')));   // 强制绕过缓存取一次最新价
  loadMarkets();
  loadPreference();
  loadTicker();
  loadMarketNewsIfActive();
}
/* 刷新时在股票价格后插入小 loading 圆点 */
function showPriceLoading() {
  document.querySelectorAll('[data-flip]').forEach(el => {
    if (el.querySelector('.pl-spin')) return;
    const s = document.createElement('span');
    s.className = 'pl-spin';
    el.appendChild(s);
  });
}
function loadMarketNewsIfActive() {
  const active = document.querySelector('.tab.active');
  if (active) loadNewsByTag(active);
}

applyI18nStatic();     // 应用语言（静态标题/占位），渲染函数内部用 _t() 取词
loadPortfolioMeta();   // 先渲染卡片框架（名称等静态信息），价格到齐后滚动填充
loadKlines();          // 股票K线数据（hover 渐现用），后台拉取
marketsPlaceholder();  // 核心指标先占位，数据到达后动效填充
loadPortfolio();
loadMarkets();
loadTicker();
loadNewsByTag({ dataset: { k: '__us__' } });   // News 默认加载美股新闻
loadPreference();
applyColorMode();
moveMtabSlider();
// 悬停暂停滚动（JS 控制，避免 animation-play-state 的跳动）
const tickerWrap = document.querySelector('.ticker-wrap');
tickerWrap.addEventListener('mouseenter', () => { tickerPaused = true; });
tickerWrap.addEventListener('mouseleave', () => { tickerPaused = false; tickerLastTs = 0; });
window.addEventListener('resize', moveMtabSlider);
setInterval(loadPortfolio, 30000);   // 行情 30 秒自动刷新
setInterval(loadMarkets, 30000);     // 核心指标同步刷新
setInterval(loadPreference, 86400000);  // 投资偏好每日刷新（行业占比变化不大）
setInterval(loadTicker, 300000);      // 滚动新闻 5 分钟更新
setInterval(loadMarketNewsIfActive, 300000);
</script>
</body>
</html>
